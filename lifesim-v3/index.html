<div class="app">

  <!-- 标题 -->
  <section id="screen-title" class="screen is-active">
    <div class="brand" aria-hidden="true"></div>
    <h1>人生模拟器</h1>
    <p class="subtitle">从出生到死亡 · 0—100 岁</p>
    <div class="menu">
      <button id="btn-start" class="btn btn-primary">开始新人生</button>
      <button id="btn-continue" class="btn" disabled>继续上次</button>
      <button id="btn-settings" class="btn btn-ghost">设置</button>
    </div>
    <p class="meta" id="last-run"></p>
    <p class="disclaimer">平均数据只是基准线，不是标准答案。虚构模拟，不预测真实人生。</p>
    <span class="version" id="version"></span>
  </section>

  <!-- 创建角色 -->
  <section id="screen-setup" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="btn-setup-back" aria-label="返回标题">←</button>
      <span class="topbar-title">出生</span>
      <span class="topbar-right" id="points-left">剩余 0</span>
    </header>
    <div class="scroll">
      <div class="block">
        <h2 class="block-title">先天属性 <span class="hint">20 点以内，每项 0—8，可以不花完</span></h2>
        <div class="attr-list" id="attr-list"></div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-small" id="btn-reroll">重新抽取</button>
          <button class="btn btn-ghost btn-small" id="btn-average">平均分配</button>
        </div>
        <p class="hint" id="derived-hint"></p>
      </div>

      <div class="block">
        <h2 class="block-title">性别 <span class="hint">初始偏移量，不锁死路径</span></h2>
        <div class="region-list" id="gender-list"></div>
      </div>

      <div class="block">
        <h2 class="block-title">天赋 <span class="hint">三选一</span></h2>
        <div class="talent-list" id="talent-list"></div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-small" id="btn-talent-reroll">换一批</button>
        </div>
      </div>

      <div class="block">
        <h2 class="block-title">出生 <span class="hint">决定起点</span></h2>
        <div class="region-list" id="region-list"></div>
      </div>
    </div>
    <footer class="footer">
      <button id="btn-create" class="btn btn-primary btn-block" disabled>出生</button>
    </footer>
  </section>

  <!-- 人生 -->
  <section id="screen-life" class="screen">
    <div class="scene" id="scene" data-scene="home" aria-hidden="true"></div>
    <header class="life-head">
      <div class="life-row">
        <div class="age-chip"><span id="age-num">0</span><small>岁</small></div>
        <div class="stage-name" id="stage-name">学前</div>
        <button class="icon-btn" id="btn-undo" aria-label="回退一次选择，可连续回退" disabled title="回退一次选择（可连点）">↶</button>
        <button class="icon-btn" id="btn-exit" aria-label="退出并保存" title="退出（自动存档）">⎋</button>
        <button class="icon-btn" id="btn-life-settings" aria-label="设置">⚙</button>
      </div>
      <div class="attrs" id="attrs-strip"></div>
    </header>
    <main class="log" id="log" role="log" aria-live="polite"></main>
    <p class="save-ind" id="save-ind">存档只保存在本机浏览器</p>
    <footer class="footer footer-actions">
      <button id="btn-auto" class="btn btn-ghost btn-auto" aria-pressed="false">自动</button>
      <button id="btn-next" class="btn btn-primary">长大一岁</button>
    </footer>
  </section>

  <!-- 死亡 -->
  <section id="screen-end" class="screen">
    <div class="scroll end-wrap">
      <p class="end-kicker" id="death-kind">人 生 落 幕</p>
      <h2 class="end-title" id="end-title"></h2>
      <p class="end-age" id="end-age"></p>
      <div class="score-ring"><span id="end-score">0</span><small id="end-grade">综合</small></div>
      <p class="end-text" id="end-text"></p>

      <div class="block">
        <h3>人生轨道</h3>
        <div class="traj-wrap">
          <svg id="traj" class="traj" viewBox="0 0 1000 260" preserveAspectRatio="xMidYMid meet"></svg>
          <div id="traj-panel" class="traj-panel"></div>
        </div>
      </div>
      <div class="block">
        <h3>这一生</h3>
        <div id="end-dims" class="dims"></div>
      </div>

      <div class="block">
        <h3>人生大事记</h3>
        <div id="end-path" class="mini-path"></div>
      </div>

      <p class="disclaimer">平均寿命 79.25 岁只是群体基准。这是虚构模拟，不预测真实人生。</p>

      <button id="btn-undo-end" class="btn btn-ghost btn-block" hidden>↶ 回退一次选择（可连点，直到第一次选择）</button>
    </div>
    <footer class="footer footer-row">
      <button class="btn btn-ghost" id="btn-end-home">回标题</button>
      <button class="btn btn-primary" id="btn-end-again">再活一次</button>
    </footer>
  </section>

  <!-- 设置 -->
  <section id="screen-settings" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="btn-settings-back" aria-label="返回">←</button>
      <span class="topbar-title">设置</span>
      <span class="topbar-right"></span>
    </header>
    <div class="scroll">
      <div class="block">
        <h3>文字速度</h3>
        <div class="seg" id="seg-speed">
          <button data-speed="off">瞬间</button>
          <button data-speed="fast">较快</button>
          <button data-speed="normal">正常</button>
        </div>
      </div>
      <div class="block">
        <h3>显示</h3>
        <label class="switch-row"><span>减少动画</span><input type="checkbox" id="chk-motion"></label>
      </div>
      <div class="block">
        <h3>数据</h3>
        <button class="btn btn-ghost btn-block" id="btn-reset">清除全部本地数据</button>
        <p class="hint" style="margin-top:10px">存档、设置与记录只保存在这台设备的浏览器里，不会上传。</p>
      </div>
      <div class="block">
        <h3>关于</h3>
        <p class="hint" id="about"></p>
      </div>
    </div>
  </section>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
